<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Plamtr Chat</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="splash" class="splash"><div class="splash-logo">💬</div><div class="splash-name">Plamtr Chat</div><div class="splash-sub">Şifreli & Hızlı Sohbet</div></div>
<div id="auth-screen" class="screen hidden"><div class="auth-wrap"><div class="auth-logo">💬</div><div class="auth-title">Plamtr Chat</div>
<div class="auth-tabs"><button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Giriş</button><button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Kayıt</button></div>
<form id="login-form" class="auth-form" onsubmit="doLogin();return false"><label>Kullanıcı Adı</label><input id="login-username" type="text" placeholder="kullanici_adi"><label>Şifre</label><input id="login-password" type="password" placeholder="••••••••"><button type="submit" class="btn-primary">Giriş Yap</button><div class="auth-link" onclick="showForgot()">Şifremi unuttum</div><div class="auth-link" onclick="showAbout()">Hakkında</div></form>
<form id="register-form" class="auth-form hidden" onsubmit="doRegister();return false"><label>Ad Soyad</label><input id="reg-fullname" type="text" placeholder="Adın Soyadın"><label>Kullanıcı Adı</label><input id="reg-username" type="text" placeholder="kullanici_adi" oninput="checkUsername()"><div id="reg-username-hint" class="username-hint"></div><label>E-posta</label><input id="reg-email" type="email" placeholder="ornek@mail.com"><label>Güvenlik Sorusu</label><select id="reg-question" onchange="showCustomQuestion()"><option value="city">Memleketin neresi?</option><option value="pet">Bebeğin neydi?</option><option value="food">En sevdiğin yemek?</option><option value="game">Sevdiğin oyun?</option><option value="custom">Kendi sorun</option></select><div id="custom-question-wrap" class="hidden"><label>Sorun</label><input id="reg-custom-question" type="text"></div><label>Cevap</label><input id="reg-answer" type="text" placeholder="Cevabın"><label>Şifre</label><input id="reg-password" type="password" placeholder="••••••••"><label>Şifre Tekrar</label><input id="reg-password2" type="password" placeholder="••••••••"><button type="submit" class="btn-primary">Kayıt Ol (200 coin 🪙)</button></form>
<form id="forgot-form" class="auth-form hidden" onsubmit="return false"><label>Kullanıcı Adı</label><input id="forgot-username" type="text" placeholder="kullanici_adi"><div style="display:flex;gap:8px"><button type="button" class="btn-sm" onclick="forgotQuestion()">🔑 Sorudan</button><button type="button" class="btn-sm" onclick="forgotEmail()">📧 E-posta</button></div><div id="forgot-q-text"></div><div id="forgot-info"></div><div id="forgot-answer-wrap" class="hidden"><label>Cevabın</label><input id="forgot-answer" type="text"><button type="button" class="btn-primary" onclick="submitForgotAnswer()">Gönder</button></div><div id="forgot-code-wrap" class="hidden"><label>6 Haneli Kod</label><input id="forgot-code" type="text" maxlength="6"><label>Yeni Şifre</label><input id="forgot-newpw" type="password"><button type="button" class="btn-primary" onclick="doResetPw()">Sıfırla</button></div><div class="auth-link" onclick="showAuthForm('login')">← Girişe dön</div></form>
<div id="about-screen" class="auth-form hidden"><h3 style="color:#f80">Hakkında</h3><p>💬 Plamtr Chat — Şifreli sohbet. 🔐 E2E, 📎 Dosya, 📞 Arama, 👥 Grup, 🪙 Coin, 👑 VIP. 🔗 @plamtr</p><div class="auth-link" onclick="showAuthForm('login')">← Girişe dön</div></div>
</div></div>
</body>
</html>
