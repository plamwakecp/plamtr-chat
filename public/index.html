<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Plamtr Chat</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="splash" class="splash"><div class="splash-logo">💬</div><div class="splash-name">Plamtr Chat</div><div class="splash-sub">Şifreli & Hızlı Sohbet</div></div>
<div id="auth-screen" class="screen hidden"><div class="auth-wrap"><div class="auth-logo">💬</div><div class="auth-title">Plamtr Chat</div><div class="auth-tabs"><button id="tab-login" class="auth-tab active">Giriş</button><button id="tab-register" class="auth-tab">Kayıt</button></div>
<form id="login-form" class="auth-form" onsubmit="doLogin();return false"><label>Kullanıcı Adı</label><input id="login-username" type="text" placeholder="kullanici_adi" autocomplete="username"><label>Şifre</label><input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"><button type="submit" class="btn-primary">Giriş Yap</button><div class="auth-link" onclick="showForgot()">Şifremi unuttum</div><div class="auth-link" onclick="showAbout()">Hakkında</div></form>
<form id="register-form" class="auth-form hidden" onsubmit="doRegister();return false"><label>Ad Soyad</label><input id="reg-fullname" type="text"><label>Kullanıcı Adı</label><input id="reg-username" type="text" oninput="checkUsername()"><div id="reg-username-hint" class="username-hint"></div><label>E-posta</label><input id="reg-email" type="email"><label>Güvenlik Sorusu</label><select id="reg-question" onchange="showCustomQuestion()"><option value="city">Memleketin neresi?</option><option value="pet">Bebeğin neydi?</option><option value="food">En sevdiğin yemek?</option><option value="game">Sevdiğin oyun?</option><option value="custom">Kendi sorun</option></select><div id="custom-question-wrap" class="hidden"><label>Sorun</label><input id="reg-custom-question" type="text"></div><label>Cevap</label><input id="reg-answer" type="text"><label>Şifre</label><input id="reg-password" type="password"><label>Şifre Tekrar</label><input id="reg-password2" type="password"><button type="submit" class="btn-primary">Kayıt Ol (200 coin 🪙)</button></form>
<form id="forgot-form" class="auth-form hidden" onsubmit="return false"><label>Kullanıcı Adı</label><input id="forgot-username" type="text"><div style="display:flex;gap:8px"><button type="button" class="btn-sm" onclick="forgotQuestion()">🔑 Sorudan</button><button type="button" class="btn-sm" onclick="forgotEmail()">📧 E-posta</button></div><div id="forgot-q-text"></div><div id="forgot-info"></div><div id="forgot-answer-wrap" class="hidden"><label>Cevabın</label><input id="forgot-answer" type="text"><button type="button" class="btn-primary" onclick="submitForgotAnswer()">Gönder</button></div><div id="forgot-code-wrap" class="hidden"><label>6 Haneli Kod</label><input id="forgot-code" type="text" maxlength="6"><label>Yeni Şifre</label><input id="forgot-newpw" type="password"><button type="button" class="btn-primary" onclick="doResetPw()">Sıfırla</button></div><div class="auth-link" onclick="showAuthForm('login')">← Girişe dön</div></form>
<div id="about-screen" class="auth-form hidden"><h3 style="color:#f80">Hakkında</h3><p>💬 Plamtr Chat — Şifreli sohbet. 🔐 E2E, 📎 Dosya, 📞 Arama, 👥 Grup, 🪙 Coin, 👑 VIP.</p><div class="auth-link" onclick="showAuthForm('login')">← Girişe dön</div></div></div></div>
<div id="app" class="screen hidden">
<div id="sidebar"><div id="sidebar-header"><div id="online-count">0 çevrimiçi</div><button class="btn-sm" onclick="showPanel('chat')">💬</button><button class="btn-sm" onclick="showPanel('friends')">👥</button><button class="btn-sm" onclick="showPanel('profile')">👤</button><button class="btn-sm" onclick="showPanel('shop')">🛒</button><button class="btn-sm" onclick="showPanel('groups')">📋</button><button class="btn-sm" onclick="showPanel('settings')">⚙️</button></div>
<div id="panel-chat" class="panel"><div id="rooms"><div class="room-btn active" data-room="genel1" onclick="switchRoom('genel1')">#genel1</div><div class="room-btn" data-room="genel2" onclick="switchRoom('genel2')">#genel2</div><div class="room-btn" data-room="genel3" onclick="switchRoom('genel3')">#genel3</div></div></div>
<div id="panel-friends" class="panel hidden"><input id="friend-username" type="text" placeholder="Kullanıcı adı"><button class="btn-sm" onclick="addFriend()">➕ Ekle</button><div id="friends-list"></div></div>
<div id="panel-profile" class="panel hidden"><div id="profile-avatar" class="profile-avatar"></div><div id="profile-name"></div><div id="profile-username"></div><div id="profile-bio"></div><div id="profile-coins"></div><div id="profile-vip"></div><button class="btn-sm" onclick="showProfileEdit()">✏️ Düzenle</button><button class="btn-sm" onclick="doLogout()">🚪 Çıkış</button></div>
<div id="panel-shop" class="panel hidden"><h3>🛒 Mağaza</h3><p>Çerçeve: <button class="btn-sm" onclick="buyItem('frame','gold')">Gold 50🪙</button><button class="btn-sm" onclick="buyItem('frame','rainbow')">Rainbow 100🪙</button><button class="btn-sm" onclick="buyItem('frame','fire')">Fire 150🪙</button><button class="btn-sm" onclick="buyItem('frame','star')">Star 200🪙</button></p><p>Efekt: <button class="btn-sm" onclick="buyItem('effect','sparkle')">✨ 30🪙</button><button class="btn-sm" onclick="buyItem('effect','rain')">🌧️ 40🪙</button><button class="btn-sm" onclick="buyItem('effect','fireworks')">🎆 60🪙</button></p><p><button class="btn-sm" onclick="buyItem('vip','1month')">VIP 1 Ay 500🪙</button></p></div>
<div id="panel-groups" class="panel hidden"><input id="group-name" type="text" placeholder="Grup adı"><button class="btn-sm" onclick="createGroup()">➕ Oluştur</button><input id="group-invite-username" type="text" placeholder="Davet et"><button class="btn-sm" onclick="inviteToGroup()">📨 Davet</button><div id="groups-list"></div></div>
<div id="panel-settings" class="panel hidden"><label>Tema</label><select id="profile-theme" onchange="toggleTheme()"><option value="dark">Karanlık</option><option value="light">Aydınlık</option></select><label>Küfür filtresi</label><input id="profile-filter" type="checkbox" onchange="toggleFilter()"><label>Çerçeve</label><select id="profile-frame" onchange="buyItem('frame',this.value)"><option value="none">Yok</option><option value="gold">Gold</option><option value="rainbow">Rainbow</option><option value="fire">Fire</option><option value="star">Star</option></select></div></div>
<div id="chat-area"><div id="chat-header"><span id="chat-title">#genel1</span></div><div id="chat-messages"></div><div id="chat-input"><input id="msg-input" type="text" placeholder="Mesaj yaz..."><button onclick="sendMessage()">➤</button></div></div></div>
<script src="/js/app.js"></script>
<script>setTimeout(function(){document.getElementById('splash').classList.add('hidden');document.getElementById('auth-screen').classList.remove('hidden');},2000);var token=localStorage.getItem('plamtr_token');if(token){fetch('/api/verify',{headers:{'x-token':token}}).then(function(r){return r.json();}).then(function(d){if(d.ok){user=d.user;document.getElementById('splash').classList.add('hidden');initApp();}});}</script>
</body>
</html>
